```yaml
name: Build GoalGetter (Android APK & iOS)

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Install project dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Install latest EAS CLI
      - name: Install EAS CLI
        run: npm install -g eas-cli@latest

      # 5. Verify Expo authentication
      - name: Verify Expo authentication
        run: eas whoami
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      # 6. Build Android APK with EAS
      - name: Build Android APK
        run: |
          eas build \
            --platform android \
            --profile production \
            --non-interactive \
            --wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      # 7. Get the latest Android build URL
      - name: Get APK download URL
        id: apk
        run: |
          BUILD_ID=$(eas build:list \
            --platform android \
            --status finished \
            --limit 1 \
            --json \
            --non-interactive | node -e "
              let data='';
              process.stdin.on('data', d => data += d);
              process.stdin.on('end', () => {
                const builds = JSON.parse(data);
                console.log(builds[0].id);
              });
            ")

          echo "BUILD_ID=$BUILD_ID" >> "$GITHUB_ENV"

          APK_URL=$(eas build:view "$BUILD_ID" \
            --json \
            --non-interactive | node -e "
              let data='';
              process.stdin.on('data', d => data += d);
              process.stdin.on('end', () => {
                const build = JSON.parse(data);
                console.log(
                  build.artifacts?.buildUrl ||
                  build.artifacts?.applicationArchiveUrl ||
                  ''
                );
              });
            ")

          if [ -z "$APK_URL" ]; then
            echo "Could not find APK download URL."
            exit 1
          fi

          echo "APK_URL=$APK_URL" >> "$GITHUB_ENV"
          echo "APK URL found."

        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      # 8. Download APK from EAS
      - name: Download APK
        run: |
          curl -L "$APK_URL" -o GoalGetter.apk

          if [ ! -s GoalGetter.apk ]; then
            echo "APK download failed."
            exit 1
          fi

          echo "APK downloaded successfully."
          ls -lh GoalGetter.apk

      # 9. Upload APK to GitHub Actions
      - name: Upload GoalGetter APK
        uses: actions/upload-artifact@v4
        with:
          name: GoalGetter.apk
          path: GoalGetter.apk
          if-no-files-found: error
          retention-days: 30

  build-ios:
    name: Build iOS
    runs-on: macos-latest

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Install project dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Install EAS CLI
      - name: Install EAS CLI
        run: npm install -g eas-cli@latest

      # 5. Verify Expo authentication
      - name: Verify Expo authentication
        run: eas whoami
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      # 6. Build iOS
      - name: Build iOS
        run: |
          eas build \
            --platform ios \
            --profile production \
            --non-interactive \
            --wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
```
